name: quran_splitter
description: تطبيق تقسيم التلاوة القرآنية — عميل خفيف يتصل بـ API على السيرفر.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0                 # نداءات الـ API
  in_app_purchase: ^3.2.0     # اشتراك Google Play Billing
  file_picker: ^8.0.0         # اختيار ملف الصوت
  path_provider: ^2.1.0       # حفظ ملف الـ zip والتسجيلات
  shared_preferences: ^2.2.0  # حفظ توكن الدخول
  just_audio: ^0.9.40         # تشغيل صوت المحفّظ
  record: ^5.1.2              # تسجيل صوت المتعلّم
  permission_handler: ^11.3.1 # أذونات الميكروفون
  wakelock_plus: ^1.2.5       # إبقاء الشاشة مضاءة أثناء الجلسة
  archive: ^3.6.1             # فكّ ضغط مقاطع الـ zip محليًّا

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
